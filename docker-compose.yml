services:
  api:
    build: .
    container_name: fastapi_api
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    networks:
      - fastapi_network
    environment:
      - ENVIRONMENT=dev
      - DATABASE_URL=postgresql://postgres:postgres@data:5432/fastapi_db
    depends_on:
      data:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8080 --reload
  data:
    image: postgres:18.6-alpine
    container_name: fastapi_data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fastapi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - fastapi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastapi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  fastapi_network:
    driver: bridge
